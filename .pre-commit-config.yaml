# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Removes trailing whitespace from all files

      - id: end-of-file-fixer
        name: Fix end of files
        description: Ensures files end with a newline

      - id: check-yaml
        name: Check YAML syntax
        description: Validates YAML file syntax

      - id: check-json
        name: Check JSON syntax
        description: Validates JSON file syntax

      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Prevents committing merge conflict markers

      - id: check-added-large-files
        name: Check for large files
        description: Prevents committing files larger than 500KB
        args: ['--maxkb=500']

      - id: detect-private-key
        name: Detect private keys
        description: Prevents committing private SSH keys

      - id: check-case-conflict
        name: Check for case conflicts
        description: Prevents case-insensitive filename conflicts

  # Security scanning - detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        description: Scans for high-entropy strings and known secret patterns
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
              package-lock.json|
              server/package-lock.json|
              .*\.lock|
              \.git/.*
          )$

  # TypeScript/JavaScript linting
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        description: Runs ESLint on staged files
        entry: npm run lint
        language: system
        types: [javascript, jsx, ts, tsx]
        pass_filenames: false

      - id: prettier
        name: Prettier
        description: Format code with Prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types: [javascript, jsx, ts, tsx, json, yaml, markdown]

  # TypeScript type checking
  - repo: local
    hooks:
      - id: tsc-client
        name: TypeScript Check (Client)
        description: Type check client TypeScript files
        entry: npm run build -- --noEmit
        language: system
        files: ^src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: tsc-server
        name: TypeScript Check (Server)
        description: Type check server TypeScript files
        entry: bash -c 'cd server && npm run typecheck'
        language: system
        files: ^server/.*\.ts$
        pass_filenames: false

  # Security audits
  - repo: local
    hooks:
      - id: npm-audit
        name: NPM Audit (Client)
        description: Check for known vulnerabilities in client dependencies
        entry: bash -c 'npm audit --audit-level=moderate || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: npm-audit-server
        name: NPM Audit (Server)
        description: Check for known vulnerabilities in server dependencies
        entry: bash -c 'cd server && npm audit --audit-level=moderate || true'
        language: system
        pass_filenames: false
        always_run: true

  # Environment file checks
  - repo: local
    hooks:
      - id: check-env-example
        name: Check .env.example files
        description: Ensures .env.example files are present and .env files are not committed
        entry: bash -c 'if git diff --cached --name-only | grep -E "\.env$"; then echo "ERROR: .env file detected! Only commit .env.example files"; exit 1; fi'
        language: system
        pass_filenames: false

      - id: validate-env-vars
        name: Validate environment variables
        description: Checks that required env vars are documented
        entry: bash -c 'test -f .env.example && test -f server/.env.example'
        language: system
        pass_filenames: false

  # Git commit message linting
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        name: Conventional Commit
        description: Ensures commit messages follow conventional commits format
        stages: [commit-msg]

# Configuration
default_language_version:
  node: system

# Run all hooks on all files periodically
# To run manually: pre-commit run --all-files
